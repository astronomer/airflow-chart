################################
## Airflow API Server VirtualService
#################################
{{- $istio := .Values.global.istio | default dict }}
{{- $gateway := $istio.gateway | default dict }}
{{- if and .Values.ingress.enabled $gateway.enabled (semverCompare ">=3.0.0" .Values.airflow.airflowVersion) }}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ .Release.Name }}-api-server-virtualservice
  labels:
    tier: airflow
    component: api-server-virtualservice
    release: {{ .Release.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
    {{- with .Values.labels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.airflow.apiServer.labels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.airflow.apiServer.annotations }}
  annotations: {{- toYaml .Values.airflow.apiServer.annotations | nindent 4 }}
  {{- end }}
spec:
  gateways:
    - {{ required "global.istio.gateway.name is required when global.istio.gateway.enabled is true" $gateway.name }}
  hosts:
    - {{- include "deployments_subdomain" . | indent 1 }}
    - {{- include "airflow_subdomain" . | indent 1 }}
    {{- if .Values.ingress.globalBaseDomain }}
    - {{- include "deployments_subdomain_global" . | indent 1 }}
    - {{- include "airflow_subdomain_global" . | indent 1 }}
    {{- end }}
  http:
    # API Server routes. Match entries are OR'd: the deployments host serves
    # Airflow only under the per-release prefix, while the per-release host serves
    # it at the root — the same split the Ingress expresses as separate host
    # rules. No rewrite: Airflow's base_url already carries the prefix.
    - match:
        - authority:
            exact: {{- include "deployments_subdomain" . | indent 1 }}
          uri:
            prefix: "/{{ .Release.Name }}/airflow"
        - authority:
            exact: {{- include "airflow_subdomain" . | indent 1 }}
        {{- if .Values.ingress.globalBaseDomain }}
        - authority:
            exact: {{- include "deployments_subdomain_global" . | indent 1 }}
          uri:
            prefix: "/{{ .Release.Name }}/airflow"
        - authority:
            exact: {{- include "airflow_subdomain_global" . | indent 1 }}
        {{- end }}
      route:
        - destination:
            host: {{ .Release.Name }}-api-server.{{ .Release.Namespace }}.svc.cluster.local
            port:
            # Istio requires a numeric port; the Ingress may use the service's
            # port name, so the auth-proxy branch resolves to a number here.
            {{- if .Values.authSidecar.enabled  }}
              number: {{ .Values.authSidecar.port }}
            {{- else }}
              number: {{ .Values.airflow.ports.apiServer }}
            {{- end }}
      {{- with $istio.virtualService | default dict }}
      {{- if hasKey . "timeout" }}
      timeout: {{ .timeout }}
      {{- end }}
      {{- if hasKey . "retries" }}
      retries:
        {{- toYaml .retries | nindent 8 }}
      {{- end }}
      {{- end }}
{{- end }}
